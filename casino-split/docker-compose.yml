services:
  postgres:
    image: postgres:16-alpine
    container_name: split-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
      POSTGRES_DB: split
    ports:
      - "5432:5432"
    volumes:
      - split_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: split-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - split_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  split_postgres_data:
  split_redis_data:
